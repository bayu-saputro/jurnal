html,body{margin:0;min-height:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:var(--text);
  background:radial-gradient(1100px 600px at 0% -10%,var(--glow),transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;min-height:100vh}
.muted{color:var(--muted)} .small{font-size:11px} .strong{font-weight:600}
.profit{color:var(--profit)} .loss{color:var(--loss)} .neutral{color:var(--neutral)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Liquid glass */
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.55)}
.glass-strong{background:var(--modal);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px rgba(20,24,30,.18),inset 0 1px 0 rgba(255,255,255,.6)}

/* Sidebar */
.sidebar{width:216px;flex:0 0 216px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:12px 10px;
  border-right:1px solid var(--border);background:var(--side);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:40;overflow-y:auto}
.brand{display:flex;gap:9px;align-items:center;padding:6px 8px 10px}
.brand svg{width:26px;height:26px;padding:5px;border-radius:8px;background:var(--btn);border:1px solid var(--border)}
.brand b{display:block;font-size:13px}
.brand small{display:block;color:var(--muted);font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-chip{margin:0 8px 8px;padding:5px 8px;border-radius:8px;font-size:10px;letter-spacing:.06em;font-weight:600;color:var(--muted);
  background:var(--hover);border:1px dashed var(--border);cursor:pointer;text-align:center}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:none;border-radius:8px;cursor:pointer;
  color:var(--text);text-decoration:none;font-size:13px;text-align:left}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--active)}
.nav-item svg,.ic{flex:0 0 auto}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:10px}
.profile{display:flex;gap:9px;align-items:center;padding:6px 8px}
.profile b{display:block;font-size:12px}
.profile small{color:var(--muted);font-size:11px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--active)}
.side-stats{margin:8px;padding:8px 0 0;display:grid;gap:6px;font-size:11.5px;border-top:1px solid var(--border)}
.side-stats div{display:flex;justify-content:space-between;gap:8px}
.side-stats span{color:var(--muted)}
.scrim{display:none}

/* Main */
.main{flex:1;min-width:0;padding:18px 24px 40px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top-l{display:flex;gap:10px;align-items:flex-start;min-width:0}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;font-weight:650;margin:0;letter-spacing:-.01em;line-height:1.2}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.grid-2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid-notes{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;align-items:start}
.panel{padding:14px 16px;border-radius:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.panel-h h3{font-size:14px;margin:0;font-weight:600}
.stat{padding:12px 14px;border-radius:14px;min-width:0}
.stat-l{font-size:11px;color:var(--muted)}
.stat-v{font-size:20px;font-weight:600;margin:4px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.stat-f{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11px;align-items:center}
.chg{font-weight:600;font-size:11px}
.chg.profit{color:var(--profit)} .chg.loss{color:var(--loss)}
.mini{padding:10px 12px;border-radius:12px;background:var(--cell);border:1px solid var(--border);min-width:0}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:11px;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.pair-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tiles .mini b{display:block;font-size:16px;margin-top:4px;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.settings-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.settings-sec h4{margin:0 0 4px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--border);
  background:var(--btn);cursor:pointer;font-size:12px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--active)}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--loss)}
.btn.ghost{background:transparent;border-color:transparent}
.btn svg{width:14px;height:14px}
.icon-btn{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:7px;cursor:pointer;color:var(--muted);padding:0}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg{width:15px;height:15px}
.seg{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:9px;padding:2px;background:var(--btn)}
.input,.select{height:30px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:var(--input);font-size:12px;outline:none;min-width:0;width:100%}
textarea.input{height:auto;min-height:64px;padding:7px 9px;resize:vertical;line-height:1.45}
.select{width:auto;max-width:180px;cursor:pointer}
.select{height:32px;font-size:14px;padding:0 8px;max-width:min(100%,230px)}
.cg-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.cg-tab{height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--border);background:var(--btn);cursor:pointer;font-size:12px}
.cg-tab.on{background:var(--info);border-color:transparent;color:#fff}
.gv-img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--input)}
.gv-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.gal-n{font-size:11px;color:var(--muted)}
.select.small{height:26px;font-size:11.5px;max-width:130px}
.input:focus,.select:focus,textarea:focus{border-color:rgba(127,134,146,.6);box-shadow:0 0 0 3px rgba(127,134,146,.15)}
.input.search{width:220px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.full{grid-column:1/-1}
.form-error{color:var(--loss);font-size:12px;min-height:16px}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.shot-img{width:100%;max-height:260px;object-fit:contain;border-radius:12px;border:1px solid var(--border);background:var(--cell);margin-top:10px}
.shot-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notes-block{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--cell);border:1px solid var(--border)}
.notes-block p,.note-sec p{margin:4px 0 0;white-space:pre-wrap;line-height:1.5}
.note-sec{padding:10px 0;border-bottom:1px solid var(--border)}
.note-sec:last-child{border-bottom:0}
.note-sec span{font-size:11px;color:var(--muted)}

/* Badges & tags */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:550;background:var(--hover);color:var(--muted);white-space:nowrap}
.badge.profit{background:var(--profit-bg);color:var(--profit)}
.badge.loss{background:var(--loss-bg);color:var(--loss)}
.tag{display:inline-block;margin-left:4px;padding:0 5px;border-radius:5px;font-size:9px;letter-spacing:.05em;font-weight:600;color:var(--muted);border:1px solid var(--border);vertical-align:middle}
.dir{font-weight:600}

/* Tables */
.table-wrap{overflow:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
td.act{white-space:nowrap;text-align:right}
th.num{text-align:right}

/* Calendar */
.cal-tool{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-tool .strong{padding:0 8px;min-width:150px}
.month-sum{margin-bottom:12px}
.week-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head div{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-cell{min-height:76px;border-radius:12px;border:1px solid var(--border);background:var(--cell);padding:7px 8px;display:flex;flex-direction:column;
  align-items:flex-start;gap:2px;text-align:left;font:inherit;font-size:11px;min-width:0;color:var(--text)}
.cal-cell.clickable{cursor:pointer}
.cal-cell.clickable:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.cal-cell.out{opacity:.35;background:transparent;border-style:dashed;box-shadow:none}
.cal-cell.profit{background:var(--profit-bg);border-color:transparent;color:var(--profit)}
.cal-cell.loss{background:var(--loss-bg);border-color:transparent;color:var(--loss)}
.cal-cell.neutral{color:var(--neutral)}
.cal-cell.today{border-color:var(--text)}
.cal-num{font-size:11px;color:var(--muted)}
.cal-cell.today .cal-num{color:var(--text);font-weight:700}
.cal-pnl{font-weight:600;font-size:12px;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal-pnl.short{display:none}
.cal-meta{font-size:10px;color:var(--muted)}

/* Charts */
.lc-wrap{position:relative;height:220px;touch-action:none;user-select:none}
.lc-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.lc-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--modal);border:2px solid var(--profit);transform:translate(-50%,-50%);display:none;pointer-events:none}
.lc-tip{position:absolute;top:6px;background:var(--tip);border:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:10px;padding:6px 9px;font-size:11px;pointer-events:none;display:none;white-space:nowrap;box-shadow:var(--shadow);transform:translateX(-50%)}
.bars{display:flex;gap:8px;height:190px}
.bar-col{flex:1;display:flex;flex-direction:column;min-width:0}
.bar-area{position:relative;flex:1}
.bar-area::after{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--border)}
.bar-pos,.bar-neg{position:absolute;left:18%;right:18%;border-radius:6px;min-height:2px}
.bar-pos{bottom:50%;background:var(--profit)}
.bar-neg{top:50%;background:var(--loss)}
.bar-label{font-size:10px;color:var(--muted);text-align:center;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:5px 0;font-size:12px}
.hbar-track{position:relative;height:8px;background:var(--hover);border-radius:6px}
.hbar-track::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--border)}
.hbar-fill{position:absolute;top:0;bottom:0;border-radius:6px}
.hbar-fill.profit{background:var(--profit)} .hbar-fill.loss{background:var(--loss)} .hbar-fill.neutral{background:var(--neutral)}
.dist{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--hover)}
.dist span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* Account cards */
.acc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.acc-card{padding:14px 16px;border-radius:16px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.acc-card:hover{transform:translateY(-2px)}
.acc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.acc-name{font-weight:600;font-size:14px}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.acc-grid span{display:block;font-size:11px;color:var(--muted)}
.acc-grid b{font-variant-numeric:tabular-nums;font-weight:600}
.acc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}

/* Notes */
.note-item{display:block;width:100%;text-align:left;padding:10px 11px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;margin-bottom:4px}
.note-item:hover{background:var(--hover)}
.note-item.active{background:var(--active);border-color:var(--border)}
.note-item b{display:block;font-size:12.5px;margin-top:3px}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(20,24,30,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:100}
.modal{width:min(540px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(820px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h2{font-size:15px;margin:0;font-weight:600}
.modal-b{padding:14px 16px 16px;overflow:auto}
.modal-b p{margin:0 0 10px;line-height:1.5}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center}
.toast{padding:9px 14px;border-radius:10px;background:var(--text);color:var(--bg);font-size:12px;box-shadow:var(--shadow);margin-top:6px}
.toast.error{background:var(--loss);color:#fff}

.seg-tabs{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:11px;background:var(--btn);margin-bottom:12px;flex-wrap:wrap;max-width:100%}
.seg-tab{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap}
.seg-tab.on{background:var(--active);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--cell);font-size:12px}
.chip button{width:20px;height:20px;border-radius:50%;border:0;background:var(--hover);cursor:pointer;color:var(--muted);line-height:1;padding:0}

/* ===== Visual refinements (mengikuti UI reference pack) ===== */
body{background-color:var(--bg)}
.sidebar{background:var(--side);border-right:1px solid var(--border);backdrop-filter:none;-webkit-backdrop-filter:none}
.brand svg{color:var(--profit);background:rgba(54,201,143,.12);border-color:transparent}
.nav-item{color:var(--muted)}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text);background:var(--active);box-shadow:inset 2px 0 0 var(--profit)}
.nav-item.active svg{color:var(--profit)}
.nav-group{letter-spacing:.08em;font-weight:500}
.glass{box-shadow:var(--shadow)}
.glass-strong{box-shadow:0 24px 60px rgba(0,0,0,.45)}
.overlay{background:rgba(5,8,12,.6)}
.btn{background:var(--btn);border-color:var(--border)}
.btn.primary{background:var(--info);color:#0D1117;border-color:transparent}
.btn.primary:hover{background:#8CB2FF}
.btn.danger{color:var(--loss)}
.input,.select{background:var(--input);border-color:var(--border)}
.input:focus,.select:focus,textarea:focus{border-color:rgba(107,158,255,.6);box-shadow:0 0 0 3px rgba(107,158,255,.15)}
.seg{background:var(--btn)}
.seg-tabs{background:var(--btn)}
.seg-tab.on{background:var(--active);color:var(--text);box-shadow:inset 0 -2px 0 var(--info)}
.demo-chip{color:var(--warm);border-color:rgba(231,184,92,.35);background:rgba(231,184,92,.08)}
.tag{color:var(--warm);border-color:rgba(231,184,92,.35)}
.stat{background:var(--panel)}
.stat-l{color:var(--muted);font-size:12px}
.stat-v{font-weight:600}
th{color:var(--muted);font-weight:500}
tbody tr:hover td{background:rgba(241,243,245,.025)}
.cal-cell.today{border-color:var(--info)}
.cal-cell.today .cal-num{color:var(--info)}
.hbar-track{background:rgba(241,243,245,.06)}
.dist{background:rgba(241,243,245,.06)}
.badge{background:rgba(241,243,245,.06)}

/* Layout overview: tabel Recent Trades penuh lebar agar tidak terpotong */
.ov-recent{grid-template-columns:1fr}
.ov-recent > .panel{grid-column:1 / -1}
.ov-recent .stack{flex-direction:row;gap:8px}
.ov-recent .stack > .mini{flex:1;min-width:0}
@media (max-width:760px){ .ov-recent .stack{flex-direction:column} }

/* Motivasi */
.motivation{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px}
.mot-icon{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:rgba(231,184,92,.12);color:var(--warm)}
.mot-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.mot-text{font-size:14px;font-weight:500;margin-top:2px;line-height:1.4}

/* Certified */
.cert-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.cert{padding:14px;border-radius:16px}
.cert-inner{border:1px solid rgba(231,184,92,.35);border-radius:12px;padding:18px 18px 14px;background:rgba(231,184,92,.04);text-align:center}
.cert-top{display:flex;justify-content:space-between;align-items:center}
.cert-badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(231,184,92,.14);color:var(--warm)}
.cert-kicker{margin-top:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--warm);font-weight:600}
.cert-name{font-size:24px;font-weight:650;margin-top:6px;letter-spacing:-.01em}
.cert-sub{color:var(--muted);font-size:12px;margin-top:4px}
.cert-acc{font-size:17px;font-weight:600;color:var(--profit);margin-top:12px}
.cert-meta{font-size:12px;margin-top:4px}
.cert-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.cert-actions{display:flex;justify-content:flex-end;margin-top:10px}

/* ===== Liquid glass touch effects ===== */
.nav-item,.btn,.icon-btn,.note-item,.acc-card,.cal-cell.clickable,.demo-chip,[data-act]:not(tr){
  position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),background-color .25s ease,box-shadow .35s ease,backdrop-filter .35s ease;
}
.ic{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.is-press,.is-press:hover{transform:scale(.94);transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s ease,box-shadow .3s ease}
.is-hold,.is-hold:hover{
  transform:scale(1.07);

/* ================= STATE ================= */
let db = null;
let CH = {}; let chSeq = 0;
let shotDraft = '';
let pendingConfirm = null;
const ui = {
  accQ:'',
  emo:{cat:'live', acc:'all'},
  ov:{account:'all', period:'all'},
  cal:{y:new Date().getFullYear(), m:new Date().getMonth(), account:'all'},
  tf:{account:'all', pair:'all', result:'all', emo:'all', q:'', sort:'date-desc'},
  an:{account:'all'},
  pay:{account:'all', status:'all'},
  accTab:'eval',
  certTab:'eval',
  noteId:null
};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayStr = () => ymd(new Date());
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmtDate = s => s ? parseYmd(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '-';
const fmtPrice = x => (x === null || x === undefined || x === '') ? '-' : Number(x).toLocaleString('en-US',{maximumFractionDigits:5});
const fmtR = r => (r === null || r === undefined || !isFinite(r)) ? '-' : `${r>=0?'+':''}${r.toFixed(2)}R`;
const money = (n, o={}) => {
  if (n === Infinity) return '∞';
  const a = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  const sign = n < 0 ? '-' : (o.sign && n > 0 ? '+' : '');
  return `${sign}$${a}`;
};
const moneyShort = n => { const a = Math.abs(n); const s = a>=1000 ? (a/1000).toFixed(1)+'k' : a.toFixed(0); return `${n<0?'-':n>0?'+':''}$${s}`; };
const pct = (n, d=1) => `${n.toFixed(d)}%`;
const pf = v => v === Infinity ? '∞' : v.toFixed(2);
const pnlClass = n => n > 0 ? 'profit' : n < 0 ? 'loss' : 'neutral';
const periodLabel = p => ({all:'All time', '7d':'Last 7 days', '30d':'Last 30 days', month:'This month'})[p] || 'All time';
const toNum = x => { if (x === null || x === undefined || String(x).trim() === '') return null; const n = Number(x); return Number.isFinite(n) ? n : NaN; };
const acc = id => db.accounts.find(a => a.id === id);
const accName = id => acc(id)?.name ?? 'Unknown account';
const uniq = a => [...new Set(a.filter(Boolean))];
const groupBy = (list, fn) => { const m = new Map(); for (const x of list) { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };

async function download(name, text){

function normalize(x){
  const dedupe = list => { const m = new Map(); list.forEach(i => m.set(i.id, i)); return [...m.values()]; };
  const arr = (v, fn) => Array.isArray(v) ? dedupe(v.filter(i => i && i.id && fn(i))) : [];
  const w = {name:'My Funded Workspace', userName:'Trader', theme:'dark', demo:false, ...(x.workspace || {})};
  const keepCerts = !!w.certReset; w.certReset = true;
  const accounts = arr(x.accounts, a => a.name && Number.isFinite(a.size));
  const firms = Array.isArray(x.propFirms) && x.propFirms.length ? [...x.propFirms] : [...PROP_FIRMS];
  accounts.forEach(a => { if (a.propFirm && !firms.includes(a.propFirm)) firms.push(a.propFirm); });
  const sizes = Array.isArray(x.accountSizes) && x.accountSizes.length ? [...x.accountSizes] : [...ACCOUNT_SIZES];
  accounts.forEach(a => { if (!sizes.includes(a.size)) sizes.push(a.size); });
  return {
    version:2,
    workspace:w,
    propFirms: uniq(firms.filter(Boolean)),
    accountSizes: [...new Set(sizes.map(Number).filter(n => n > 0))].sort((a,b) => a-b),
    accounts,
    trades: arr(x.trades, t => t.accountId && t.date && Number.isFinite(t.pnl)),
    payouts: arr(x.payouts, p => p.accountId && Number.isFinite(p.amount)),
    notes: arr(x.notes, n => n.date),
    investments: arr(x.investments, i => i.propFirm && Number.isFinite(i.price)),
    firmLogos: (x.firmLogos && typeof x.firmLogos === 'object') ? {...x.firmLogos} : {},
    certImages: (keepCerts && x.certImages && typeof x.certImages === 'object') ? {...x.certImages} : {},
    certGallery: Array.isArray(x.certGallery) ? x.certGallery.filter(c => c && c.id && c.img) : []
  };
}

/* ================= CALCULATIONS ================= */
function sortTrades(list){ return [...list].sort((a,b) => a.date.localeCompare(b.date) || (a.createdAt||0) - (b.createdAt||0)); }
function periodRange(p){
  const t = new Date(), today = ymd(t);
  if (p === '7d') return {from: ymd(addDays(t,-6)), to: today};
  if (p === '30d') return {from: ymd(addDays(t,-29)), to: today};
  if (p === 'month') return {from: `${t.getFullYear()}-${pad(t.getMonth()+1)}-01`, to: today};
  return null;
}
const GROUP_PREFIX = 'grp:';
/* Mengembalikan daftar id account untuk pilihan: 'all', 'grp:<groupId>', atau id account tunggal */
function accIdsFor(sel){
  if (!sel || sel === 'all') return db.accounts.map(a => a.id);
  if (String(sel).startsWith(GROUP_PREFIX)) {
    const g = GROUPS.find(x => x.id === sel.slice(GROUP_PREFIX.length));
    return g ? db.accounts.filter(a => g.statuses.includes(a.status)).map(a => a.id) : [];
  }
  return acc(sel) ? [sel] : [];
}
function tradesFiltered({account='all', period='all'}={}){
  let list = db.trades;
  if (account !== 'all') { const ids = new Set(accIdsFor(account)); list = list.filter(t => ids.has(t.accountId)); }
  const r = periodRange(period);
  if (r) list = list.filter(t => t.date >= r.from && t.date <= r.to);
  return sortTrades(list);
}
function stats(list){
  const s = sortTrades(list);
  const n = s.length;
  const wins = s.filter(t => t.result === 'Win').length;
  const losses = s.filter(t => t.result === 'Loss').length;
  const winners = s.filter(t => t.pnl > 0), losers = s.filter(t => t.pnl < 0);
  const gp = winners.reduce((a,t) => a + t.pnl, 0);
  const gl = losers.reduce((a,t) => a + t.pnl, 0);
  const net = s.reduce((a,t) => a + t.pnl, 0);
  const avgWin = winners.length ? gp / winners.length : 0;
  const avgLoss = losers.length ? gl / losers.length : 0;
  const winRate = n ? wins / n * 100 : 0;
  const lossRate = n ? losses / n * 100 : 0;
  const pfv = gl === 0 ? (gp > 0 ? Infinity : 0) : gp / Math.abs(gl);
  const rs = s.map(t => t.rMultiple).filter(x => Number.isFinite(x));
  const avgR = rs.length ? rs.reduce((a,b) => a+b, 0) / rs.length : 0;
  const expectancy = n ? (wins/n)*avgWin + (losses/n)*avgLoss : 0;
  let cum = 0, peak = 0, maxDD = 0;
  for (const t of s) { cum += t.pnl; peak = Math.max(peak, cum); maxDD = Math.max(maxDD, peak - cum); }
  let cw = 0, cl = 0, mw = 0, ml = 0;
  for (const t of s) {
    if (t.pnl > 0) { cw++; cl = 0; } else if (t.pnl < 0) { cl++; cw = 0; } else { cw = 0; cl = 0; }
    mw = Math.max(mw, cw); ml = Math.max(ml, cl);
  }
  const risks = s.map(t => t.risk).filter(x => x > 0);
  return {
    n, wins, losses, be: n - wins - losses, nWin: winners.length, nLoss: losers.length,
    gp, gl, net, avgWin, avgLoss, winRate, lossRate, pf: pfv, avgR, expectancy, maxDD,
    maxWinStreak: mw, maxLossStreak: ml,
    largestWin: winners.length ? Math.max(...winners.map(t => t.pnl)) : 0,
    largestLoss: losers.length ? Math.min(...losers.map(t => t.pnl)) : 0,
    avgRisk: risks.length ? risks.reduce((a,b) => a+b, 0) / risks.length : 0
  };
}

function lineChart(pts){
  if (pts.length < 2) return '<div class="empty">Belum ada transaksi untuk ditampilkan.</div>';
  const W = 800, H = 240, P = 10;
  const vals = pts.map(p => p.value);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi - lo < 1) hi = lo + 1;
  const xs = i => P + i*(W-2*P)/(pts.length-1);
  const ys = v => P + (hi-v)/(hi-lo)*(H-2*P);
  const path = pts.map((p,i) => `${i?'L':'M'}${xs(i).toFixed(1)} ${ys(p.value).toFixed(1)}`).join(' ');
  const zero = ys(0).toFixed(1);
  const area = `${path} L${xs(pts.length-1).toFixed(1)} ${zero} L${xs(0).toFixed(1)} ${zero} Z`;
  const col = pts[pts.length-1].value >= 0 ? 'var(--profit)' : 'var(--loss)';
  const key = 'c' + (++chSeq);
  CH[key] = pts.map((p,i) => ({...p, xp: xs(i)/W*100, yp: ys(p.value)/H*100}));
  const grid = [0.25,0.5,0.75].map(f => `<line x1="0" x2="${W}" y1="${P+f*(H-2*P)}" y2="${P+f*(H-2*P)}" stroke="var(--border)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`).join('');
  return `<div class="lc-wrap" data-chart="${key}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="g${key}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      ${grid}
      <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--muted)" stroke-opacity=".5" vector-effect="non-scaling-stroke"/>
      <path d="${area}" fill="url(#g${key})"/>
      <path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="lc-dot" style="border-color:${col}"></div>
    <div class="lc-tip"></div>
  </div>`;
}

function calendarBody(year, month, accountId){
  const days = new Date(year, month+1, 0).getDate();
  const offset = (new Date(year, month, 1).getDay()+6) % 7;
  const rows = Math.ceil((offset+days)/7);
  const prefix = `${year}-${pad(month+1)}-`;
  const calIds = new Set(accIdsFor(accountId));
  const list = db.trades.filter(t => calIds.has(t.accountId) && t.date.startsWith(prefix));
  const byDay = new Map();
  const weeks = Array.from({length:rows}, () => ({net:0, wins:0, count:0}));
  for (const t of list) {
    const dd = Number(t.date.slice(8,10)) - 1;
    if (!byDay.has(t.date)) byDay.set(t.date, {net:0, count:0});
    const dy = byDay.get(t.date); dy.net += t.pnl; dy.count++;
    const w = weeks[Math.floor((dd+offset)/7)];
    w.net += t.pnl; w.count++; if (t.result === 'Win') w.wins++;
  }
  const monthNet = round2(list.reduce((a,t) => a+t.pnl, 0));
  const dayVals = [...byDay.entries()];
  const tradingDays = dayVals.length;
  const winDays = dayVals.filter(([,v]) => v.net > 0).length;
  const lossDays = dayVals.filter(([,v]) => v.net < 0).length;
  let best = null, worst = null;
  for (const e of dayVals) { if (!best || e[1].net > best[1].net) best = e; if (!worst || e[1].net < worst[1].net) worst = e; }
  const avg = tradingDays ? monthNet / tradingDays : 0;
  const cells = [];
  for (let i = 0; i < rows*7; i++) {
    const dn = i - offset + 1;
    if (dn < 1 || dn > days) { cells.push('<div class="cal-cell out"></div>'); continue; }
    const ds = prefix + pad(dn);
    const v = byDay.get(ds);
    const today = ds === todayStr() ? 'today' : '';
    if (v) cells.push(`<button type="button" class="cal-cell clickable ${pnlClass(v.net)} ${today}" data-act="dayTrades" data-date="${ds}">
        <span class="cal-num">${dn}</span>
        <span class="cal-pnl full">${money(v.net,{sign:true})}</span><span class="cal-pnl short">${moneyShort(v.net)}</span>
        <span class="cal-meta">${v.count} trade${v.count>1?'s':''}</span></button>`);
    else cells.push(`<div class="cal-cell ${today}"><span class="cal-num">${dn}</span></div>`);
  }
  return `
  <div class="month-sum">
    <div class="tiles">
      <div class="mini"><div class="muted small">Monthly Net P&L</div><b class="${pnlClass(monthNet)}">${money(monthNet,{sign:true})}</b></div>
      <div class="mini"><div class="muted small">Trading Days</div><b>${tradingDays}</b></div>
      <div class="mini"><div class="muted small">Winning Days</div><b class="profit">${winDays}</b></div>
      <div class="mini"><div class="muted small">Losing Days</div><b class="loss">${lossDays}</b></div>
      <div class="mini"><div class="muted small">Best Day</div><b class="${best?pnlClass(best[1].net):''}">${best?`${money(best[1].net,{sign:true})}`:'-'}</b><div class="muted small">${best?fmtDate(best[0]):''}</div></div>
      <div class="mini"><div class="muted small">Worst Day</div><b class="${worst?pnlClass(worst[1].net):''}">${worst?money(worst[1].net,{sign:true}):'-'}</b><div class="muted small">${worst?fmtDate(worst[0]):''}</div></div>
      <div class="mini"><div class="muted small">Average Daily P&L</div><b class="${pnlClass(avg)}">${money(avg,{sign:true})}</b></div>
    </div>
  </div>
  <div class="week-row">${weeks.map((w,i) => `<div class="mini">
      <div class="muted small">Week ${i+1}</div>
      <div class="strong ${pnlClass(w.net)}">${money(w.net,{sign:true})}</div>
      <div class="muted small">${w.wins}W · ${w.count-w.wins}L · WR ${w.count?pct(w.wins/w.count*100,0):'-'}</div></div>`).join('')}
  </div>
  <div class="cal-head">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div>${d}</div>`).join('')}</div>
  <div class="cal-grid" style="margin-top:6px">${cells.join('')}</div>`;
}

function growthStats(trades, sel){
  const ids = accIdsFor(sel), start = ids.reduce((x,id) => x + (acc(id) ? acc(id).initialBalance : 0), 0);
  const s = stats(trades); let eq = start, peak = start, dd = 0;
  sortTrades(trades).forEach(t => { eq += t.pnl; peak = Math.max(peak, eq); if (peak > 0) dd = Math.max(dd, (peak - eq) / peak * 100); });
  const p = v => start ? v / start * 100 : 0;
  return {start, eq, gain:p(s.gp), loss:p(s.gl), net:p(s.net), dd};
}
const EMO_CATS = [
  {id:'breached', label:'Breached Accounts', statuses:['Breached'], color:'var(--loss)'},
  {id:'eval', label:'Evaluation Accounts', statuses:['Evaluation'], color:'var(--warm)'},
  {id:'live', label:'Live Funded Accounts', statuses:['Funded'], color:'var(--profit)'}
];
const EMO_MIN_SAMPLE = 3;
function emotionAnalysis(catId, accId){
  const c = EMO_CATS.find(x => x.id === catId) || EMO_CATS[2];
  const accs = db.accounts.filter(a => c.statuses.includes(a.status));
  const ids = accId && accId !== 'all' && accs.some(a => a.id === accId) ? [accId] : accs.map(a => a.id);
  const tagged = db.trades.filter(t => ids.includes(t.accountId) && emoOf(t.emotion));
  const rows = EMOTIONS.map(e => {
    const list = tagged.filter(t => t.emotion === e.id);
    const st = stats(list), rc = countRes(list);
    return {e, n:list.length, win:rc.win, lose:rc.lose, be:rc.be, wr:st.winRate, net:st.net, avg: list.length ? st.net / list.length : 0};
  });
  const ok = rows.filter(r => r.n >= EMO_MIN_SAMPLE);
  const best = ok.length ? ok.reduce((a, b) => (b.net > a.net || (b.net === a.net && b.wr > a.wr)) ? b : a) : null;
  const worst = ok.length ? ok.reduce((a, b) => (b.net < a.net || (b.net === a.net && b.wr < a.wr)) ? b : a) : null;
  return {c, accs, ids, total: tagged.length, rows, best, worst};
}

    ['Average Winning Trade', money(s.avgWin,{sign:true})], ['Average Losing Trade', money(s.avgLoss)],
    ['Largest Winning Trade', money(s.largestWin,{sign:true})], ['Largest Losing Trade', money(s.largestLoss)],
    ['Maximum Drawdown', money(s.maxDD ? -s.maxDD : 0)], ['Consecutive Wins', s.maxWinStreak], ['Consecutive Losses', s.maxLossStreak]
  ];
  return {
    title:'Analytics', sub:'Statistik performa trading secara menyeluruh.',
    actions: accSelect('an.account', f.account),
    body: `<div class="stack">
      ${(() => { const g = growthStats(trades, f.account), c = v => v > 0 ? 'profit' : v < 0 ? 'loss' : ''; const sg = v => (v > 0 ? '+' : '') + v.toFixed(2) + '%';
        return `<div class="panel glass"><div class="panel-h"><h3>Return</h3><span class="muted small">Starting balance akun terpilih</span></div><div class="tiles">
        <div class="mini"><div class="muted small">Gain</div><b class="profit">${sg(g.gain)}</b></div>
        <div class="mini"><div class="muted small">Loss</div><b class="loss">${sg(g.loss)}</b></div>
        <div class="mini"><div class="muted small">Net Return</div><b class="${c(g.net)}">${sg(g.net)}</b></div>
        <div class="mini"><div class="muted small">Max Drawdown</div><b class="${g.dd ? 'loss' : ''}">${g.dd ? '-' + g.dd.toFixed(2) + '%' : '0.00%'}</b></div>
        <div class="mini"><div class="muted small">Starting Balance</div><b>${money(g.start)}</b></div>
        <div class="mini"><div class="muted small">Current Equity</div><b>${money(g.eq)}</b></div></div></div>`; })()}
      <div class="panel glass"><div class="panel-h"><h3>Trading Performance</h3></div>
        <div class="tiles">${tiles.map(([l,v]) => `<div class="mini"><div class="muted small">${l}</div><b>${v}</b></div>`).join('')}</div></div>
      <div class="grid-2">
        <div class="panel glass"><div class="panel-h"><h3>Equity Curve</h3></div>${lineChart(equitySeries(trades))}</div>
        <div class="panel glass"><div class="panel-h"><h3>Win / Loss Distribution</h3><span class="muted small">${s.n} trades</span></div>
          <div class="dist"><span style="width:${s.wins/tot*100}%;background:var(--profit)"></span><span style="width:${s.be/tot*100}%;background:var(--neutral)"></span><span style="width:${s.losses/tot*100}%;background:var(--loss)"></span></div>
          <div class="legend"><span><i style="background:var(--profit)"></i>Win ${s.wins} (${pct(s.wins/tot*100,0)})</span><span><i style="background:var(--neutral)"></i>BE ${s.be}</span><span><i style="background:var(--loss)"></i>Loss ${s.losses} (${pct(s.losses/tot*100,0)})</span></div>
          <div style="margin-top:16px"><div class="muted small" style="margin-bottom:6px">Monthly P&amp;L</div>${barChart(monthlyItems(trades,12))}</div>
        </div>
      </div>
      <div class="grid-2e">
        <div class="panel glass"><div class="panel-h"><h3>Pair Performance</h3></div>${hbars(pairRows.filter(r => r.n).map(r => ({label:r.label, value:r.net})))}
          <div style="margin-top:12px">${breakdownTable(pairRows)}</div></div>
        <div class="panel glass"><div class="panel-h"><h3>Session Performance</h3></div>${hbars(sessRows.filter(r => r.n).map(r => ({label:r.label, value:r.net})))}
          <div style="margin-top:12px">${breakdownTable(sessRows)}</div></div>
      </div>
      ${renderEmotional()}
    </div>`
  };
};

P.payouts = () => {
  const f = ui.pay;
  const payIds = new Set(accIdsFor(f.account));
  let list = db.payouts.filter(p => payIds.has(p.accountId));
  const shown = f.status === 'all' ? list : list.filter(p => p.status === f.status);
  const nonRej = list.filter(p => p.status !== 'Rejected');
  const total = nonRej.reduce((a,p) => a+p.amount, 0);
  const pending = list.filter(p => ['Requested','Processing','Approved'].includes(p.status)).reduce((a,p) => a+p.amount, 0);
  const withdrawn = list.filter(p => p.status === 'Paid').reduce((a,p) => a+p.amount, 0);
  const sorted = [...shown].sort((a,b) => b.requestDate.localeCompare(a.requestDate));
  return {
    title:'Payout History', sub:'Pencatatan payout dari prop firm. Terpisah dari realized trading P&L.',
    actions: `<button class="btn primary" type="button" data-act="addPayout">${ic('plus')} Request Payout</button>`,
    body: `<div class="stack">
      <div class="grid-stats">
        ${stat('Total Payout', money(total), '', 'Excl. rejected')}
        ${stat('Pending Payout', money(pending), '', 'Requested, processing, approved')}
        ${stat('Total Withdrawn', money(withdrawn), '', 'Status paid', 'profit')}
        ${stat('Payout History', list.length, '', 'Total records')}
      </div>
      <div class="panel glass">
        <div class="toolbar">
          ${accSelect('pay.account', f.account)}
          <select class="select" data-path="pay.status" aria-label="Status filter"><option value="all">All Status</option>${PAYOUT_STATUSES.map(s => `<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        ${sorted.length ? `<div class="table-wrap"><table><thead><tr><th>Prop Firm</th><th>Account</th><th>Request Date</th><th class="num">Payout Amount</th><th class="num">Profit Split</th><th>Payment Method</th><th>Payout Status</th><th></th></tr></thead><tbody>
          ${sorted.map(p => `<tr>
            <td><b>${esc(p.propFirm)}</b></td><td>${esc(accName(p.accountId))}</td><td>${fmtDate(p.requestDate)}</td>
            <td class="num"><b>${money(p.amount)}</b></td><td class="num">${p.profitSplit}%</td><td>${esc(p.method)}</td>
            <td><select class="select small" data-payout-status="${p.id}" aria-label="Payout status">${PAYOUT_STATUSES.map(s => `<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
            <td class="act"><button class="icon-btn" type="button" data-act="editPayout" data-id="${p.id}" aria-label="Edit">${ic('edit')}</button><button class="icon-btn" type="button" data-act="deletePayout" data-id="${p.id}" aria-label="Delete">${ic('trash')}</button></td>
          </tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">Belum ada payout yang tercatat.</div>'}
      </div>
    </div>`
  };
};

P.notes = () => {
  const notes = [...db.notes].sort((a,b) => b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  const sel = notes.find(n => n.id === ui.noteId) || notes[0];
  if (sel) ui.noteId = sel.id;
  const sec = (label, text) => `<div class="note-sec"><span>${label}</span><p>${esc(text || '-')}</p></div>`;
  return {
    title:'Trading Notes', sub:'Catatan evaluasi trading harian.',
    actions:`<button class="btn primary" type="button" data-act="addNote">${ic('plus')} New Note</button>`,
    body: notes.length ? `<div class="grid-notes">
      <div class="panel glass" style="padding:8px">
        ${notes.map(n => `<button type="button" class="note-item ${sel && sel.id===n.id?'active':''}" data-act="selNote" data-id="${n.id}">
          <span class="muted small">${fmtDate(n.date)} · ${esc(n.session||'-')}</span>
          <b>${esc(n.marketBias||'-')} bias${n.demo?' ':''}</b>
          <span class="muted small ellipsis" style="display:block">${esc(n.lessons||n.entryReason||'')}</span></button>`).join('')}
      </div>
      ${sel ? `<div class="panel glass">
        <div class="panel-h"><div><h3>${fmtDate(sel.date)}</h3><div class="muted small">${esc(sel.session||'-')} · Market bias: ${esc(sel.marketBias||'-')}</div></div>
          <div class="top-r"><button class="btn" type="button" data-act="editNote" data-id="${sel.id}">${ic('edit')} Edit</button>
          <button class="btn danger" type="button" data-act="deleteNote" data-id="${sel.id}">${ic('trash')} Delete</button></div></div>
        ${sec('HTF Analysis', sel.htf)}${sec('LTF Confirmation', sel.ltf)}${sec('Entry Reason', sel.entryReason)}
        ${sec('Exit Reason', sel.exitReason)}${sec('Mistakes', sel.mistakes)}${sec('Lessons Learned', sel.lessons)}
      </div>` : ''}
    </div>` : emptyBox('Belum ada catatan.', '<button class="btn primary" type="button" data-act="addNote">+ New Note</button>')
  };
};

  return {name: PAGE_NAMES.includes(name) ? name : 'overview', id};

function sanitizeUi(){

  if (!ok(ui.tf.account)) ui.tf.account = 'all';
  if (!ok(ui.cal.account)) ui.cal.account = 'all';
  if (!ok(ui.an.account)) ui.an.account = 'all';
  if (!ok(ui.pay.account)) ui.pay.account = 'all';
}

const DOCK = [
  {id:'overview', label:'Overview', icon:'home', pages:[['overview','Overview','layout-grid']]},
  {id:'jurnal', label:'Jurnal', icon:'book', pages:[['calendar','P&L Calendar','calendar'],['trades','Trade History','list']]},
  {id:'analitik', label:'Analitik', icon:'bar-chart', pages:[['analytics','Analytics','bar-chart'],['monthly','Monthly Performance','trending'],['gallery','Trade Gallery','image']]},
  {id:'funded', label:'Funded', icon:'wallet', pages:[['accounts','Funded Accounts','wallet'],['payouts','Payout History','banknote'],['certified','Certified','award'],['investment','Prop Firm Investment','pie']]},
  {id:'lainnya', label:'Lainnya', icon:'sliders', pages:[['notes','Trading Notes','notebook']], extra:true}
];
let dockOpen = null;
function renderDock(cur){
  const groupOf = id => (DOCK.find(g => g.pages.some(p => p[0] === id)) || {}).id;
  const active = cur === 'account' ? 'funded' : (groupOf(cur) || (cur === 'overview' ? 'overview' : null));
  $('#dock').innerHTML = DOCK.map(g => `<button type="button" class="dock-btn ${active === g.id ? 'active' : ''} ${dockOpen === g.id ? 'open' : ''}" data-dock="${g.id}" aria-label="${g.label}">${ic(g.icon)}<span>${g.label}</span></button>`).join('');
  if (dockOpen) renderDockSheet(cur);
  else $('#dockSheet').hidden = true;
}
function renderDockSheet(cur){
  const g = DOCK.find(x => x.id === dockOpen); const sh = $('#dockSheet');
  if (!g) { sh.hidden = true; return; }
  let items = g.pages.map(([id,label,icon]) => `<a class="nav-item ${cur===id?'active':''}" href="#${id}" data-dock-close>${ic(icon)}<span>${label}</span></a>`).join('');
  if (g.extra) items += `<div class="dock-h" style="margin-top:6px">Lainnya</div><button class="nav-item" type="button" data-act="settings" data-dock-close>${ic('settings')}<span>Workspace settings</span></button>`;
  sh.innerHTML = `<div class="dock-h">${g.label}</div>${items}`;
  sh.hidden = false;
}
document.addEventListener('click', e => {
  if (quickOpen && !e.target.closest('.qm')) { quickOpen = false; const m = $('#qmMenu'); if (m) m.hidden = true; }
  if (e.target.closest('[data-qm]')) { quickOpen = false; }
  if (e.target.closest('[data-menu-close]') && $('#modalRoot').innerHTML) closeModal();

/* ---- Dock: tahan menu untuk memunculkan lensa kaca, geser untuk memilih menu ---- */
let dockHold = null;
document.addEventListener('pointerdown', e => {
  const btn = e.target.closest && e.target.closest('.dock-btn');
  if (!btn || e.button > 0) return;
  dockHold = {btn, dock: btn.parentElement, x: e.clientX, y: e.clientY, active: false, lens: null, last: btn, timer: null};
  dockHold.timer = setTimeout(startDockLens, 180);
}, true);
function startDockLens(){
  if (!dockHold) return;
  dockHold.active = true;
  const lens = document.createElement('div');
  lens.className = 'dock-lens';
  dockHold.dock.appendChild(lens);
  dockHold.lens = lens;
  moveDockLens(dockHold.btn, true);
  if (navigator.vibrate) navigator.vibrate(6);
}
function moveDockLens(btn, instant){
  const dr = dockHold.dock.getBoundingClientRect(), r = btn.getBoundingClientRect(), L = dockHold.lens;
  if (instant) L.style.transition = 'none';
  L.style.left = (r.left - dr.left) + 'px';
  L.style.top = (r.top - dr.top) + 'px';
  L.style.width = r.width + 'px';
  L.style.height = r.height + 'px';
  if (instant) { void L.offsetWidth; L.style.transition = ''; L.classList.add('on'); }
}
document.addEventListener('pointermove', e => {
  if (!dockHold) return;
  if (!dockHold.active) {
    if (Math.hypot(e.clientX - dockHold.x, e.clientY - dockHold.y) > 10) { clearTimeout(dockHold.timer); dockHold = null; }
    return;
  }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const b = el && el.closest ? el.closest('.dock-btn') : null;
  if (b && b.parentElement === dockHold.dock && b !== dockHold.last) {
    dockHold.last = b;
    moveDockLens(b, false);
    if (navigator.vibrate) navigator.vibrate(4);
  }
});
function endDockHold(){
  if (!dockHold) return;
  clearTimeout(dockHold.timer);
  const h = dockHold;
  dockHold = null;
  if (h.lens) {
    h.lens.classList.remove('on');
    setTimeout(() => h.lens.remove(), 220);
    if (h.last && h.last !== h.btn) h.last.click();
  }
}
document.addEventListener('pointerup', endDockHold);
document.addEventListener('pointercancel', endDockHold);
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.dock')) e.preventDefault(); });

/* ---- Geser horizontal antar menu utama (sentuh saja). Dinonaktifkan di tabel, grafik, form, dan saat popup terbuka ---- */
const SWIPE_PAGES = ['overview','calendar','trades','analytics','monthly','gallery','accounts','payouts','investment','certified','notes'];
let pendingEnter = null;
let swipe = null, swipeLocked = false;
const SWIPE_SKIP = '.table-wrap,.mp-wrap,.mp-chart-wrap,.donut-wrap,svg,input,select,textarea,label,button,a,.gal-grid,.gal-card,.gal-tabs,.cg-tabs,.cg-photo,.cg-top,.seg-tabs,.mo-cats,.mo-pick,.emo-grid,.emo-cats,.res-grid,.search-bar,.dock,.dock-sheet,.qm-menu,[data-no-swipe]';
const viewEl = () => document.getElementById('view');
document.addEventListener('pointerdown', e => {
  const v = viewEl();
  if (!v || e.pointerType === 'mouse' || e.button > 0 || dockHold) { swipe = null; return; }
  if (e.clientX < 24 || e.clientX > window.innerWidth - 24) { swipe = null; return; }
  if (!v.contains(e.target) || e.target.closest(SWIPE_SKIP) || $('#modalRoot').innerHTML) { swipe = null; return; }
  swipe = {x: e.clientX, y: e.clientY, dx: 0, mode: null};
});
document.addEventListener('pointermove', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (!swipe.mode) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    swipe.mode = Math.abs(dx) > Math.abs(dy) * 1.4 ? 'h' : 'v';
    if (swipe.mode === 'v') { swipe = null; return; }
  }
  swipe.dx = dx;
  const v = viewEl(); if (!v) return;
  const atEnd = (dx < 0 && SWIPE_PAGES.indexOf(route().name) >= SWIPE_PAGES.length - 1) || (dx > 0 && SWIPE_PAGES.indexOf(route().name) <= 0);
  const k = atEnd ? 0.12 : 0.35;                 // tahanan di ujung daftar
  v.style.transition = 'none';
  v.style.transform = `translate3d(${Math.max(-120, Math.min(120, dx)) * k}px,0,0)`;
});
function endSwipe(){
  if (!swipe) return;
  const h = swipe; swipe = null;
  const v = viewEl();
  const cur = SWIPE_PAGES.indexOf(route().name);
  let next = null;
  if (h.mode === 'h' && Math.abs(h.dx) > 60) {
    if (h.dx < 0 && cur >= 0 && cur < SWIPE_PAGES.length - 1) next = SWIPE_PAGES[cur + 1];
    if (h.dx > 0 && cur > 0) next = SWIPE_PAGES[cur - 1];
  }
  if (v) { v.style.transition = ''; v.style.transform = ''; }
  if (next) { pendingEnter = SWIPE_PAGES.indexOf(next) > cur ? 'enter-r' : 'enter-l'; location.hash = '#' + next; }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', () => { swipe = null; const v = viewEl(); if (v) { v.style.transition = ''; v.style.transform = ''; } });

function saveTrade(form){
  const d = Object.fromEntries(new FormData(form));
  const errs = [];
  if (!acc(d.accountId)) errs.push('Pilih funded account.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) errs.push('Trade date tidak valid.');
  const pair = (d.pair || '').trim().toUpperCase();
  if (!pair) errs.push('Trading pair wajib diisi.');
  if (!['Buy','Sell'].includes(d.direction)) errs.push('Pilih Buy atau Sell.');
  const gross = toNum(d.grossPnl), comm = toNum(d.commission) ?? 0;
  if (!Number.isFinite(gross)) errs.push('Gross P&L wajib berupa angka.');
  if (!Number.isFinite(comm) || comm < 0) errs.push('Commission harus angka 0 atau lebih.');
  const pnl = (Number.isFinite(gross) && Number.isFinite(comm)) ? round2(gross - comm) : NaN;
  const risk = toNum(d.risk);
  if (!(risk > 0)) errs.push('Risk amount harus lebih dari 0.');
  const entry = toNum(d.entry), sl = toNum(d.stopLoss), tp = toNum(d.takeProfit), rIn = toNum(d.rMultiple);
  if ([entry, sl, tp, rIn].some(x => x !== null && !Number.isFinite(x))) errs.push('Entry, SL, TP, lot dan R harus berupa angka.');
  if (!RESULTS.includes(d.result)) errs.push('Pilih hasil transaksi.');
  if (Number.isFinite(pnl)) {
    if (d.result === 'Win' && pnl <= 0) errs.push('Hasil Win membutuhkan Net P&L positif.');
    if (d.result === 'Loss' && pnl >= 0) errs.push('Hasil Loss membutuhkan Net P&L negatif.');
    if (d.result === 'Break Even' && Math.abs(pnl) > 10) errs.push('Break Even hanya untuk Net P&L antara -10 dan 10.');
  }
  if (errs.length) return showErr(form, errs);
  const id = form.dataset.id || uid('t');
  const old = db.trades.find(x => x.id === id);
  const rec = {
    id, createdAt: old?.createdAt ?? Date.now(), demo: old?.demo ?? false,
    accountId: d.accountId, date: d.date, pair, direction: d.direction, session: d.session,
    setup: old?.setup, lots: old?.lots,
    entry, stopLoss: sl, takeProfit: tp, risk: round2(risk),
    grossPnl: round2(gross), commission: round2(comm), emotion: d.emotion || null,
    pnl: round2(pnl), rMultiple: round2(rIn ?? pnl/risk), result: d.result,
    screenshot: old?.screenshot || '', notes: (d.notes || '').trim(), analysis: anCleaned()
  };
  const prevT = old ? {...old} : null;
  upsert(db.trades, rec);
  if (!save()) { if (prevT) upsert(db.trades, prevT); else db.trades = db.trades.filter(x => x.id !== id); return; }
  closeModal(); toast('Trade tersimpan'); render();
}

function importFile(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!Array.isArray(j.accounts) || !Array.isArray(j.trades)) throw new Error('accounts/trades tidak ditemukan');
      const next = normalize(j);
      confirmBox(`Impor ${next.accounts.length} account, ${next.trades.length} trade, ${next.payouts.length} payout, ${next.notes.length} catatan. Data saat ini akan diganti.`, () => { db = next; applyTheme(); });
      pendingConfirm = (() => { const fn = pendingConfirm; return () => { fn(); toast('Import berhasil'); }; })();
    } catch (e) { toast('Import gagal: ' + e.message, 'error'); }
  };
  r.readAsText(file);
}
function readShot(file, cb){
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const s = Math.min(1, 900 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', 0.72));
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('File gambar tidak bisa dibaca', 'error'); };
  img.src = url;
}

document.addEventListener('pointermove', e => {
  const w = e.target.closest ? e.target.closest('.lc-wrap') : null;
  document.querySelectorAll('.lc-wrap').forEach(x => { if (x !== w) { x.querySelector('.lc-dot').style.display = 'none'; x.querySelector('.lc-tip').style.display = 'none'; } });
  if (!w) return;
  const pts = CH[w.dataset.chart]; if (!pts || !pts.length) return;
  const r = w.getBoundingClientRect();
  const f = (e.clientX - r.left) / r.width * 100;
  let best = 0, bd = Infinity;
  pts.forEach((p,i) => { const d = Math.abs(p.xp - f); if (d < bd) { bd = d; best = i; } });
  const p = pts[best];
  const dot = w.querySelector('.lc-dot'), tip = w.querySelector('.lc-tip');
  dot.style.display = 'block'; dot.style.left = p.xp + '%'; dot.style.top = p.yp + '%';
  tip.style.display = 'block';
  tip.innerHTML = `<div class="muted">${esc(p.label)}</div><div class="strong">${money(p.value)}</div>${p.pnl !== undefined ? `<div class="${pnlClass(p.pnl)}">Trade: ${money(p.pnl,{sign:true})}</div>` : ''}`;
  const left = Math.min(Math.max(p.xp/100 * r.width, 70), r.width - 70);
  tip.style.left = left + 'px';
});

function pickImage(cb){
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp';
  i.onchange = () => { const f = i.files && i.files[0]; if (f) cb(f); };
  i.click();
}
function readImage(file, max){
  return new Promise((resolve, reject) => {
    if (!isImg(file)) return reject(new Error('Format harus JPG, JPEG, PNG, atau WEBP'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/webp', 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak bisa dibaca')); };
    img.src = url;
  });
}
function uploadImage(max, apply){
  pickImage(f => readImage(f, max).then(apply).catch(e => toast(e.message, 'error')));
}

/* ---- Monthly performance ---- */
function monthlyRows(){
  const byMonth = new Map();
  db.trades.forEach(t => {
    if (!t.date) return;
    const k = t.date.slice(0, 7);
    if (!byMonth.has(k)) byMonth.set(k, []);
    byMonth.get(k).push(t);
  });
  const initial = db.accounts.reduce((s, a) => s + (a.initialBalance || 0), 0);
  let cum = 0;
  return [...byMonth.keys()].sort().map(k => {
    const list = byMonth.get(k);
    const base = initial + cum;
    const net = list.reduce((s, t) => s + t.pnl, 0);
    const gain = list.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnl, 0);
    const loss = list.filter(t => t.pnl < 0).reduce((s, t) => s + t.pnl, 0);
    cum += net;
    const ok = base > 0;
    return {key:k, net, gain, loss, base, n:list.length, ok,
      gainPct: ok ? gain / base * 100 : 0, lossPct: ok ? loss / base * 100 : 0, retPct: ok ? net / base * 100 : 0};
  });
}
function monthlyChartFor(scope, last){
  CHART_SCOPE = scope;
  const rows = monthlyRowsFor(scope);
  return `<div class="mp-chart-wrap">${monthlyChart(last ? rows.slice(-last) : rows)}</div>`;
}
function monthlyChart(rows){
  const scopeAttr = CHART_SCOPE ? CHART_SCOPE.join(',') : '';
  const colW = 76, W = Math.max(340, rows.length * colW), H = 230, padT = 18, padB = 34;
  const vals = rows.flatMap(r => [r.gainPct, r.lossPct, r.retPct]);
  let hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
  if (hi === lo) hi += 1;
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const zero = y(0), pts = [];
  const bars = rows.map((r, i) => {
    const cx = i * colW + colW / 2, gy = y(r.gainPct), ly = y(r.lossPct), ry = y(r.retPct);
    pts.push(`${cx},${ry}`);
    return `<g class="mo-bar" data-act="moPick" data-key="${r.key}" data-scope="${scopeAttr}" role="button" tabindex="0" aria-label="Detail ${monthLabel(r.key)}">
      <rect x="${cx-38}" y="0" width="76" height="${H}" fill="transparent"/>
      <rect x="${cx-16}" y="${gy}" width="32" height="${Math.max(0, zero - gy)}" rx="4" fill="var(--profit)" opacity=".85"/>
      <rect x="${cx-16}" y="${zero}" width="32" height="${Math.max(0, ly - zero)}" rx="4" fill="var(--loss)" opacity=".85"/>
      <circle cx="${cx}" cy="${ry}" r="4.5" fill="var(--info)"/>
      <text x="${cx}" y="${ry - 10}" text-anchor="middle" class="mp-lbl">${r.ok ? fmtPct(r.retPct) : '—'}</text>
      <text x="${cx}" y="${H - 12}" text-anchor="middle" class="mp-axis">${monthShort(r.key)}</text></g>`;
  }).join('');
  return `<svg class="mp-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik performa bulanan">
    <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--border)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--info)" stroke-width="2"/>${bars}</svg>`;
}
const monthlyPage = () => {
  const rows = monthlyRows();
  const head = {title:'Monthly Performance', sub:'Gain, loss, dan return bulanan dihitung dari balance awal bulan.', actions:''};
  if (!rows.length) return {...head, body: emptyBox('Belum ada trade. Tambahkan trade untuk melihat performa bulanan.')};
  const valid = rows.filter(r => r.ok);
  const last = rows[rows.length - 1], prev = rows[rows.length - 2];
  const best = valid.length ? valid.reduce((a, b) => b.retPct > a.retPct ? b : a) : null;
  const worst = valid.length ? valid.reduce((a, b) => b.retPct < a.retPct ? b : a) : null;
  const cards = [
    stat('Net Return · ' + monthLabel(last.key), last.ok ? fmtPct(last.retPct) : '—', '', money(last.net, {sign:true}), pnlClass(last.net)),
    best ? stat('Bulan Terbaik', fmtPct(best.retPct), '', monthLabel(best.key), 'profit') : '',
    worst ? stat('Bulan Terburuk', fmtPct(worst.retPct), '', monthLabel(worst.key), 'loss') : '',
    stat('Total Bulan', rows.length, '', `${rows.reduce((s, r) => s + r.n, 0)} trade`)
  ].join('');
  const legend = `<div class="mp-legend"><span><i style="background:var(--profit)"></i>Gain</span><span><i style="background:var(--loss)"></i>Loss</span><span><i style="background:var(--info)"></i>Net Return</span></div>`;
  const tr = [...rows].reverse().map((r, idx, arr) => {
    const p = rows[rows.indexOf(r) - 1];
    let vs = '—';
    if (p && p.ok && r.ok) { const d = r.retPct - p.retPct; vs = `<span class="${d >= 0 ? 'profit' : 'loss'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(2)} pp</span>`; }
    const f = (v, ok, cls) => ok ? `<span class="${cls}">${fmtPct(v)}</span>` : '—';
    return `<tr><td class="strong">${monthLabel(r.key)}</td>
      <td class="${pnlClass(r.net)}">${money(r.net, {sign:true})}</td>
      <td>${f(r.gainPct, r.ok, 'profit')}</td><td>${f(r.lossPct, r.ok, 'loss')}</td>
      <td class="strong">${f(r.retPct, r.ok, pnlClass(r.retPct))}</td><td>${vs}</td></tr>`;
  }).join('');
  return {...head, body: `<div class="stack">
    <div class="grid-stats">${cards}</div>
    <div class="panel glass"><div class="panel-h"><h3>Grafik Performa Bulanan</h3>${legend}</div>
      <div class="mp-chart-wrap">${monthlyChart(rows)}</div></div>
    <div class="panel glass"><div class="panel-h"><h3>Monthly P&L & Persentase</h3><span class="muted small">Base = balance awal bulan</span></div>
      <div class="mp-wrap"><table class="mp-table"><thead><tr><th>Bulan</th><th>Monthly P&L</th><th>Monthly Gain</th><th>Monthly Loss</th><th>Net Monthly Return</th><th>vs Bulan Lalu</th></tr></thead>
      <tbody>${tr}</tbody></table></div></div></div>`};
};

/* ---- Prop Firm Investment ---- */
function donutSVG(I, E){
  const C = 2 * Math.PI * 80, tot = I + E;
  const eF = tot ? E / tot : 0, iF = tot ? I / tot : 0;
  const INV = '#C8475B', EARN = '#32C48D';
  const seg = (cls, color, len, off) => `<g class="donut-seg ${cls}">
      <circle class="glow" cx="100" cy="100" r="80" fill="none" stroke="${color}" stroke-width="18" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}" filter="url(#donutGlow)"/>
      <circle class="main" cx="100" cy="100" r="80" fill="none" stroke="${color}" stroke-width="18" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}"/>
      <circle class="edge" cx="100" cy="100" r="89" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}"/>
      <circle class="edge" cx="100" cy="100" r="71" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}"/>
    </g>`;
  return `<svg viewBox="0 0 200 200" aria-hidden="true" class="donut-svg"><defs>
      <filter id="donutGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter></defs><g transform="rotate(-90 100 100)">
    <circle cx="100" cy="100" r="80" fill="none" stroke="var(--border)" stroke-width="18"/>
    ${tot ? seg('inv', INV, iF*C, -eF*C) + seg('earn', EARN, eF*C, 0) : ''}
  </g></svg>`;
}

    ? `<div class="mp-wrap"><table class="mp-table inv-table"><thead><tr><th>Prop Firm</th><th>Tanggal</th><th>Jumlah</th><th>Status</th></tr></thead><tbody>${payRows}</tbody></table></div>`
    : emptyBox('Belum ada payout.');
  return {

    </div>`
  };
};

function saveInvestment(form){
  const d = Object.fromEntries(new FormData(form));
  const firm = (d.propFirm === '__new__' ? (d.propFirmNew || '') : (d.propFirm || '')).trim();
  const price = toNum(d.price), errs = [];
  if (!firm) errs.push('Pilih atau isi nama prop firm.');
  if (!(price > 0)) errs.push('Harga harus lebih dari 0.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) errs.push('Tanggal tidak valid.');
  if (!INVEST_STATUSES.includes(d.status)) errs.push('Pilih status.');
  if (errs.length) return showErr(form, errs);
  if (!db.propFirms.includes(firm)) db.propFirms.push(firm);
  const id = form.dataset.id || uid('inv');
  const old = db.investments.find(x => x.id === id);
  upsert(db.investments, {id, propFirm:firm, accountName:(d.accountName || '').trim(), date:d.date, price:round2(price), status:d.status, createdAt: old?.createdAt ?? Date.now()});
  save(); closeModal(); toast('Investment tersimpan'); render();
}

function anFromTrade(t){
  const a = t.analysis || {}, d = emptyAn();
  SEC.forEach(([k]) => { if (a[k]) d[k] = {text: a[k].text || '', items: (a[k].items || []).map(x => ({...x}))}; });

function anCleaned(){
  const out = {}; let any = false;
  SEC.forEach(([k]) => {
    const s = anDraft[k], text = (s.text || '').trim();
    const items = s.items.map(i => ({id:i.id, img:i.img, desc:(i.desc || '').trim()}));
    if (text || items.length) { any = true; out[k] = {text, items}; }
  });
  return any ? out : undefined;
}
function isImg(f){ return IMG_TYPES.includes(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name || ''); }
function pickImages(cb, multiple=false){
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp'; i.multiple = multiple;
  i.style.display = 'none'; document.body.appendChild(i);
  i.addEventListener('change', () => { const files = [...(i.files || [])]; i.remove(); if (files.length) cb(files); });
  i.addEventListener('cancel', () => i.remove());
  i.click();
}

let liveTimer = null;
// Re-render setelah jeda singkat, lalu kembalikan fokus dan posisi kursor ke kolom yang sedang diketik.
function liveRender(path){
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => {
    const act = document.activeElement;
    const pos = act && act.dataset && act.dataset.path === path ? act.selectionStart : null;
    render();
    const el = document.querySelector(`[data-path="${path}"][data-live]`);
    if (el) { el.focus({preventScroll:true}); if (pos !== null) { try { el.setSelectionRange(pos, pos); } catch (_) {} } }
  }, 160);
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.anText) { anDraft[t.dataset.anText].text = t.value; return; }
  if (t.dataset && t.dataset.anDesc) { const it = anDraft[t.dataset.anDesc].items.find(x => x.id === t.dataset.id); if (it) it.desc = t.value; }
});

/* ---- Save helper: never report success when storage failed ---- */
function commit(apply, undo, msg){
  apply();
  if (save()) { if (msg) toast(msg); render(); return true; }
  undo(); render(); return false;
}

/* ---- Monthly per account ---- */
function allMonthKeys(){ return [...new Set(db.trades.filter(t => t.date).map(t => t.date.slice(0, 7)))].sort(); }
function scopeIds(sel){
  if (sel == null) return null;
  return Array.isArray(sel) ? sel : [sel];
}
function monthlyRowsFor(sel){
  const ids = scopeIds(sel);
  const trades = ids ? db.trades.filter(t => ids.includes(t.accountId)) : db.trades;
  const initial = ids ? ids.reduce((s, id) => s + (acc(id)?.initialBalance || 0), 0) : db.accounts.reduce((s, a) => s + (a.initialBalance || 0), 0);
  const byMonth = new Map();
  trades.forEach(t => { if (!t.date) return; const k = t.date.slice(0, 7); if (!byMonth.has(k)) byMonth.set(k, []); byMonth.get(k).push(t); });
  let cum = 0;
  return [...byMonth.keys()].sort().map(k => {
    const list = byMonth.get(k), base = initial + cum;
    const net = list.reduce((s, t) => s + t.pnl, 0);
    const gain = list.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnl, 0);
    const loss = list.filter(t => t.pnl < 0).reduce((s, t) => s + t.pnl, 0);
    cum += net;
    const ok = base > 0;
    return {key:k, net, gain, loss, base, endEq: base + net, n:list.length, ok,
      gainPct: ok ? gain / base * 100 : 0, lossPct: ok ? loss / base * 100 : 0, retPct: ok ? net / base * 100 : 0};
  });
}
const countRes = list => ({
  win: list.filter(t => t.result === 'Win').length,

  const cmpRows = catAccs.map(a => {

  return {...head, body: `<div class="stack">${catCards}${picker}${nav}

var UPL = {}, uplSeq = 0;
function upl(kind, key, multiple, text){
  const tok = 'u' + (++uplSeq);

  return `<label class="btn upl">${ic('upload')} <span>${text}</span><input class="upl-input" type="file" accept="image/jpeg,image/png,image/webp" data-upl="${tok}"${multiple ? ' multiple' : ''}></label>`;
}
document.addEventListener('change', e => {

  t.value = '';
  if (!reg || !files.length) return;
  const label = t.closest('label'), span = label && label.querySelector('span');
  if (span) span.textContent = 'Membaca ' + files[0].name + '…';
  const done = () => { if (span) span.textContent = ''; };
  const fail = err => { toast(err.message || 'Gambar tidak bisa diproses', 'error'); done(); };
  if (reg.kind === 'cert') {
    readImage(files[0], 1000).then(url => {
      const prev = db.certImages[reg.key];
      commit(() => { db.certImages[reg.key] = url; }, () => { if (prev) db.certImages[reg.key] = prev; else delete db.certImages[reg.key]; }, 'Sertifikat tersimpan');
    }).catch(fail);
  } else if (reg.kind === 'logo') {
    readImage(files[0], 256).then(url => {
      const prev = db.firmLogos[reg.key];
      commit(() => { db.firmLogos[reg.key] = url; }, () => { if (prev) db.firmLogos[reg.key] = prev; else delete db.firmLogos[reg.key]; }, 'Logo tersimpan');
      openFirmLogos();
    }).catch(fail);
  } else if (reg.kind === 'an') {
    (async () => {
      const added = [];
      for (const f of files.slice(0, 10)) {
        try { added.push({id: uid('im'), img: await readImage(f, 1000), desc: ''}); } catch (err) { toast(err.message, 'error'); }
      }
      if (added.length) { anDraft[reg.key].items.push(...added); refreshAn(); toast(`${added.length} foto ditambahkan. Tekan Save Trade untuk menyimpan.`); }
      done();
    })();
  } else if (reg.kind === 'gal') {
    (async () => {
      const added = [];
      const cat = CG_CATS.some(([k]) => k === reg.key) ? reg.key : null;
      if (!cat) { toast('Kategori tidak dikenali', 'error'); done(); return; }
      for (const f of files.slice(0, 20)) {
        try { added.push({id: uid('cg'), cat, img: await readImage(f, 1000), createdAt: Date.now()}); } catch (err) { toast(err.message, 'error'); }
      }

        const prev = db.certGallery.slice();
        commit(() => { db.certGallery.push(...added); }, () => { db.certGallery = prev; }, `${added.length} foto ditambahkan`);
      }
      done();
    })();
  } else if (reg.kind === 'galr') {
    readImage(files[0], 1000).then(img => {
      const c = db.certGallery.find(x => x.id === reg.key); if (!c) return;
      const old = c.img;
      commit(() => { c.img = img; }, () => { c.img = old; }, 'Foto diganti');
    }).catch(fail);
  } else if (reg.kind === 'anr') {
    const [sec, id] = reg.key.split('|');
    readImage(files[0], 1000).then(img => {
      const it = anDraft[sec].items.find(x => x.id === id); if (it) { it.img = img; refreshAn(); }
    }).catch(fail);
  }
});

  const s = document.createElement('span');
  s.className = 'lg-ripple';
  s.style.left = (e.clientX - r.left) + 'px';
  s.style.top = (e.clientY - r.top) + 'px';
  el.appendChild(s);
  s.addEventListener('animationend', () => s.remove());
}
document.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  const el = pressTarget(e.target);
  if (!el) return;
  endPress();
  pressEl = el; pressX = e.clientX; pressY = e.clientY;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--x', (e.clientX - r.left) + 'px');
  el.style.setProperty('--y', (e.clientY - r.top) + 'px');
  el.classList.add('is-press');
  holdTimer = setTimeout(() => {
    if (pressEl === el) {
      el.classList.add('is-hold');
      if (navigator.vibrate) navigator.vibrate(6);
    }
  }, 220);
});
document.addEventListener('pointermove', e => {
  if (pressEl && Math.hypot(e.clientX - pressX, e.clientY - pressY) > 10) endPress();
});
document.addEventListener('pointerup', e => {
  if (!pressEl) return;
  const el = pressEl;
  endPress();
  spawnRipple(el, e);
});
document.addEventListener('pointercancel', endPress);
window.addEventListener('blur', endPress);
window.addEventListener('hashchange', () => { H.closeDrawer(); render(); });

function setPath(path, value){
  const keys = path.split('.'); let o = ui;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length-1]] = value;
}

/* ================= INIT ================= */
load();
applyTheme();
render();
setTimeout(() => document.documentElement.classList.add('intro-done'), 1100);
</script>

  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
